<!DOCTYPE html>
<html>

<head>
    <title>Public Key</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="icon.jpg" />
    <link rel="stylesheet" href="index.css" />

    <style>
        textarea {
            width: 100%;
            height: 50%;
            padding: 5vw 5vw;
            box-sizing: border-box;
            border-radius: 0.5vw;
            background-color: black;
            resize: none;
            font-size: 1.5vw;
            font-family: monospace;
            color: white;
        }

        button {
            width: 50%;
            padding: 1vw;
            border-radius: 0.5vw;
            background-color: rgb(160, 160, 160);
            font-size: 1.25vw;
            font-family: 'Play', sans-serif;
        }

        button { 
            float: left;
        }
    </style>

    <script>
        function pk_copy() {
            var copyText = document.getElementById("pk_area");
            copyText.select();
            copyText.setSelectionRange(0, 99999);
            document.execCommand("copy");
            alert(`The public key has been copied.
Der öffentliche Schlüssel wurde kopiert.
Открытый ключ скопирован.
از کلید همگانی رونوشت‌برداری شده است.`);
        }
    </script>
</head>

<body>
    <div class="centered_boxed">
        <textarea id='pk_area' rows="9" cols="64" readonly>
-----BEGIN PUBLIC KEY-----

Qdlna5yAVSkp7Vs7yFTJjc8vPQRZvqcbcpkTrc6LqySLwZ1g5nDbLpyQHnBINqmL
RQIDAQAB
-----END PUBLIC KEY-----</textarea>
    <br />
    <button onclick="pk_copy()"><strong>Copy | Kopieren | Копировать | رونوشت</strong></button>
    <a href="public_key.pem" download="public_key.pem"><button><strong>Download | Herunterladen | Скачать | دریافت</strong></button></a>
    </div>
</body>

</html>
