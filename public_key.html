    <script>
        function pk_copy() {
            var copyText = document.getElementById("pk_area");
            copyText.select();
            copyText.setSelectionRange(0, 99999);
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(copyText.value).catch(function () {
                    document.execCommand("copy");
                });
            } else {
                document.execCommand("copy");
            }
            alert(
                `The public key has been copied.
Der öffentliche Schlüssel wurde kopiert.
Открытый ключ скопирован.
از کلید همگانی رونوشت‌برداری شده است.`
            );
        }
    </script>
